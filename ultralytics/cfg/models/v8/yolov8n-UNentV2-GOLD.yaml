
# Ultralytics YOLO 🚀, AGPL-3.0 license
# YOLOv8 object detection model with P3-P5 outputs. For Usage examples see https://docs.ultralytics.com/tasks/detect
 
# Parameters
nc: 80  # number of classes
scales: # model compound scaling constants, i.e. 'model=yolov8n.yaml' will call yolov8.yaml with scale 'n'
  # [depth, width, max_channels]
  n: [0.33, 0.25, 1024]  # YOLOv8n summary: 225 layers,  3157200 parameters,  3157184 gradients,   8.9 GFLOPs
  s: [0.33, 0.50, 1024]  # YOLOv8s summary: 225 layers, 11166560 parameters, 11166544 gradients,  28.8 GFLOPs
  m: [0.67, 0.75, 768]   # YOLOv8m summary: 295 layers, 25902640 parameters, 25902624 gradients,  79.3 GFLOPs
  l: [1.00, 1.00, 512]   # YOLOv8l summary: 365 layers, 43691520 parameters, 43691504 gradients, 165.7 GFLOPs
  x: [1.00, 1.25, 512]   # YOLOv8x summary: 365 layers, 68229648 parameters, 68229632 gradients, 258.5 GFLOPs
 
 # 这个不能运行，有bug
 
# YOLOv8.0n backbone
backbone:
  # [from, repeats, module, args]
  - [-1, 1, pvt_v2_b0, []]  # 4
  - [-1, 1, Conv, [64, 3, 2]]  # 5-P1/2
  - [-1, 1, Conv, [128, 3, 2]]  # 6-P2/4
  - [-1, 3, C2f, [128, True]] # 7-c2
  - [-1, 1, Conv, [256, 3, 2]]  # 8-P3/8
  - [-1, 6, C2f, [256, True]] # 9-c3
  - [-1, 1, Conv, [512, 3, 2]]  # 10-P4/16
  - [-1, 6, C2f, [512, True]] # 11-c4
  - [-1, 1, Conv, [1024, 3, 2]]  # 12-P5/32
  - [-1, 3, C2f, [1024, True]] # 13
  - [-1, 1, SPPF, [1024, 5]]  # 14-c5
 
# YOLOv8.0n head
head:
  - [[7, 9, 11, -1], 1, Low_FAM, []] # 15
  - [-1, 1, Low_IFM, [96, 3, 768]] # 16
  - [-1, 1, Split, [512, 256]] # 17-low_global_info
 
  - [14, 1, SimConv, [512, 1, 1]] # 18-c5_half
  - [[9, 11, -1], 1, Low_LAF, [512]] # 19
  - [[-1, 17], 1, Inject, [512, 0]] # 20
  - [-1, 1, RepBlock, [512, 12]] # 21-p4
 
  - [-1, 1, SimConv, [256, 1, 1]] # 22-p4_half
  - [[7, 9, -1], 1, Low_LAF, [256]] # 23
  - [[-1, 21], 1, Inject, [256, 1]] # 24
  - [-1, 1, RepBlock, [256, 12]] # 25-p3
 
  - [[-1, 21, 14], 1, High_FAM, [1, 'torch']] # 26
  - [-1, 1, High_IFM, [2, 448, 8, 4, 1, 2, 0, 0, [0.1, 2]]] # 27
  - [-1, 1, nn.Conv2d, [1536, 1, 1, 0]] # 28
  - [-1, 1, Split, [512, 1024]] # 29-high_global_info  
 
  - [[25, 22], 1, High_LAF, []] # 30
  - [[-1, 29], 1, Inject, [512, 0]] # 31
  - [-1, 1, RepBlock, [512, 12]] # 32-n4
 
  - [[-1, 18], 1, High_LAF, []] # 33
  - [[-1, 29], 1, Inject, [1024, 1]] # 34
  - [-1, 1, RepBlock, [1024, 12]] # 35-n5
 
  - [[25, 32, 35], 1, Segment, [nc, 32, 256]]
