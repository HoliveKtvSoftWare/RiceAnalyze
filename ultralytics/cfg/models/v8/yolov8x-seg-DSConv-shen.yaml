# Ultralytics YOLO 🚀, AGPL-3.0 license
# YOLOv8-seg instance segmentation model. For Usage examples see https://docs.ultralytics.com/tasks/segment

# Parameters
nc: 80 # number of classes
scales: # model compound scaling constants, i.e. 'model=yolov8n-seg.yaml' will call yolov8-seg.yaml with scale 'n'
  # [depth, width, max_channels]
  n: [0.33, 0.25, 1024]
  s: [0.33, 0.50, 1024]
  m: [0.67, 0.75, 768]
  l: [1.00, 1.00, 512]
  x: [1.00, 1.25, 512]

# YOLOv8.0n backbone
backbone:
  # [from, repeats, module, args]
  - [-1, 1, Conv, [64, 3, 2]]  # 0-P1/2
  - [-1, 1, Conv, [128, 3, 2]]  # 1-P2/4
  - [-1, 3, C2f, [128, True]]  # 2
  - [-1, 1, Conv, [256, 3, 2]]  # 3-P3/8
  - [-1, 6, C2f_DSConv, [256, True]]  # 4 替换深层 C2f
  - [-1, 1, Conv, [512, 3, 2]]  # 5-P4/16
  - [-1, 6, C2f_DSConv, [512, True]]  # 6 替换深层 C2f
  - [-1, 1, Conv, [1024, 3, 2]]  # 7-P5/32
  - [-1, 3, C2f_DSConv, [1024, True]]  # 8 替换深层 C2f
  - [-1, 1, SPPF, [1024, 5]]  # 9

# YOLOv8.0-p2 head
head:
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]  # 10
  - [[-1, 6], 1, Concat, [1]]  # 11-cat backbone P4
  - [-1, 3, C2f_DSConv, [512]]  # 12 替换特征融合模块

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]  # 13
  - [[-1, 4], 1, Concat, [1]]  # 14-cat backbone P3
  - [-1, 3, C2f_DSConv, [256]]  # 15 替换特征融合模块 (P3/8-small)

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]  # 16
  - [[-1, 2], 1, Concat, [1]]  # 17-cat backbone P2
  - [-1, 3, C2f_DSConv, [128]]  # 18 替换特征融合模块 (P2/4-xsmall)

  - [-1, 1, Conv, [128, 3, 2]]  # 19
  - [[-1, 15], 1, Concat, [1]]  # 20-cat head P3
  - [-1, 3, C2f_DSConv, [256]]  # 21 替换特征融合模块 (P3/8-small)

  - [-1, 1, Conv, [256, 3, 2]]  # 22
  - [[-1, 12], 1, Concat, [1]]  # 23-cat head P4
  - [-1, 3, C2f_DSConv, [512]]  # 24 替换特征融合模块 (P4/16-medium)

  - [-1, 1, Conv, [512, 3, 2]]  # 25
  - [[-1, 9], 1, Concat, [1]]  # 26-cat head P5
  - [-1, 3, C2f_DSConv, [1024]]  # 27 替换特征融合模块 (P5/32-large)

  - [[18, 21, 24, 27], 1, Segment, [nc, 32, 256]]  # 28-Segment(P2, P3, P4, P5)