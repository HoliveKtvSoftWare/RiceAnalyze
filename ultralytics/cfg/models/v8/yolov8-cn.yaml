# YOLOv8 object detection model with P3-P5 outputs. For Usage examples see https://docs.ultralytics.com/tasks/detect

# 参数
nc: 80  # 类别数量，表示模型要检测的对象类别总数，这里是80类（例如COCO数据集中的80类）

scales:  # 模型复合缩放系数，用于不同大小的YOLOv8模型（如n/s/m/l/x）
  # [深度, 宽度, 最大通道数]
  n: [0.33, 0.25, 1024]  # YOLOv8n：小型模型，深度为0.33，宽度为0.25，最大通道数为1024
  s: [0.33, 0.50, 1024]  # YOLOv8s：较小模型，深度为0.33，宽度为0.50，最大通道数为1024
  m: [0.67, 0.75, 768]   # YOLOv8m：中型模型，深度为0.67，宽度为0.75，最大通道数为768
  l: [1.00, 1.00, 512]   # YOLOv8l：大型模型，深度为1.0，宽度为1.0，最大通道数为512
  x: [1.00, 1.25, 512]   # YOLOv8x：超大型模型，深度为1.0，宽度为1.25，最大通道数为512

# YOLOv8.0n backbone
backbone:  # Backbone部分用于特征提取，输入图片通过该部分后输出特征图
  # [from, repeats, module, args]
  # from: 表示输入来自哪一层，-1 表示上一层输出
  # repeats: 表示该模块重复的次数
  # module: 模块类型，例如Conv卷积，C2f瓶颈模块等
  # args: 模块的参数，通常是通道数、卷积核大小、步长等
  - [-1, 1, Conv, [64, 3, 2]]   # 0-P1/2：卷积层，输入来自上一层，使用3x3卷积核，步长为2，输出通道数为64（图片尺寸缩小一半）
  - [-1, 1, Conv, [128, 3, 2]]  # 1-P2/4：卷积层，步长为2，输出通道数为128（再次缩小图片尺寸）
  - [-1, 3, C2f, [128, True]]   # 2-C2f模块重复3次，输出通道数128，True表示残差连接
  - [-1, 1, Conv, [256, 3, 2]]  # 3-P3/8：卷积层，步长为2，输出通道数为256（继续缩小图片尺寸）
  - [-1, 6, C2f, [256, True]]   # 4-C2f模块重复6次，输出通道数256，True表示残差连接
  - [-1, 1, Conv, [512, 3, 2]]  # 5-P4/16：卷积层，步长为2，输出通道数为512（图片尺寸继续缩小）
  - [-1, 6, C2f, [512, True]]   # 6-C2f模块重复6次，输出通道数512，True表示残差连接
  - [-1, 1, Conv, [1024, 3, 2]] # 7-P5/32：卷积层，步长为2，输出通道数为1024（图片尺寸进一步缩小）
  - [-1, 3, C2f, [1024, True]]  # 8-C2f模块重复3次，输出通道数1024，True表示残差连接
  - [-1, 1, SPPF, [1024, 5]]    # 9-SPPF：空间金字塔池化层，用5x5卷积进行特征融合

# YOLOv8.0n head
head:  # Head部分用于多尺度检测，融合不同层次的特征以生成最终的预测结果
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]  # 10-上采样层，倍增特征图尺寸，使用nearest邻近插值，尺寸放大2倍
  - [[-1, 6], 1, Concat, [1]]  # 11-特征融合：将当前特征图与来自backbone第6层的特征图进行拼接（P4层特征图）
  - [-1, 3, C2f, [512]]  # 12-C2f模块，重复3次，输出通道数为512，用于处理拼接后的特征图
  
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]  # 13-上采样层，倍增特征图尺寸
  - [[-1, 4], 1, Concat, [1]]  # 14-特征融合：将当前特征图与来自backbone第4层的特征图进行拼接（P3层特征图）
  - [-1, 3, C2f, [256]]  # 15-C2f模块，重复3次，输出通道数为256，用于处理拼接后的特征图（适合小目标检测）
  
  - [-1, 1, Conv, [256, 3, 2]]  # 16-卷积层，步长为2，缩小特征图尺寸，用于恢复到P4特征图大小
  - [[-1, 12], 1, Concat, [1]]  # 17-特征融合：将当前特征图与head第12层的特征图进行拼接（P4层特征图）
  - [-1, 3, C2f, [512]]  # 18-C2f模块，重复3次，输出通道数为512，用于处理拼接后的特征图（适合中等目标检测）
  
  - [-1, 1, Conv, [512, 3, 2]]  # 19-卷积层，步长为2，缩小特征图尺寸，用于恢复到P5特征图大小
  - [[-1, 9], 1, Concat, [1]]  # 20-特征融合：将当前特征图与head第9层的特征图进行拼接（P5层特征图）
  - [-1, 3, C2f, [1024]]  # 21-C2f模块，重复3次，输出通道数为1024，用于处理拼接后的特征图（适合大目标检测）
  
  - [[15, 18, 21], 1, Detect, [nc]]  # Detect层：最终的检测层，使用P3、P4、P5特征图进行检测，nc表示类别数量
